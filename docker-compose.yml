services:
  postgres:
    image: postgres:16-alpine
    container_name: bharatchat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bharatchat
      POSTGRES_PASSWORD: bharatchat_dev_password
      POSTGRES_DB: bharatchat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bharatchat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatchat -d bharatchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bharatchat_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - bharatchat_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Local development only. Production must use a supported, patched S3 service.
    image: quay.io/minio/minio@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    container_name: bharatchat_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: bharatchat_admin
      MINIO_ROOT_PASSWORD: bharatchat_dev_password
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - bharatchat_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: bharatchat_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
    command: ["./scripts/wait-for-it.sh", "postgres:5432", "--", "air"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    profiles: [web]
    image: nginx@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    container_name: bharatchat_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bharatchat_pg_data:
  bharatchat_redis_data:
  bharatchat_minio_data:
