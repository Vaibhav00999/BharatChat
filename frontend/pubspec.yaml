name: bharatchat
description: Cross-platform real-time messaging client for BharatChat.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^18.0.2
  dio: ^5.5.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.0.0
  web_socket_channel: ^3.0.1
  uuid: ^4.4.2
  cryptography: ^2.9.0
  share_plus: ^12.0.2
  file_selector: ^1.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
