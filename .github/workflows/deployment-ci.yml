name: Deployment Configuration CI

on:
  pull_request:
    paths: ["deploy/**", ".github/workflows/deployment-ci.yml"]
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/deployment-ci.yml"]

permissions:
  contents: read

jobs:
  verify:
    name: Deployment Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test host provisioning without AWS access
        shell: pwsh
        run: |
          ./deploy/aws/tests/create-host_test.ps1
          ./deploy/aws/tests/onboarding-policy_test.ps1
          ./deploy/aws/tests/login-owner_test.ps1
      - name: Validate EC2 provisioning template
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn-lint"
          "$RUNNER_TEMP/cfn-lint/bin/pip" install cfn-lint==1.56.3
          "$RUNNER_TEMP/cfn-lint/bin/cfn-lint" --regions ap-south-1 --template deploy/aws/ec2-host.yml deploy/aws/provisioning-iam.yml
          "$RUNNER_TEMP/cfn-lint/bin/python" deploy/aws/tests/provisioning_policy_test.py
      - name: Check configuration without AWS access
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/work:ro" -w /work \
            nginx@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3 \
            -c 'apk add --no-cache bash jq openssl shellcheck >/dev/null && bash deploy/aws/test-config.sh'
      - name: Validate Compose schema without real secrets
        run: |
          export BACKEND_ENV_FILE="$RUNNER_TEMP/backend.env"
          export BACKEND_IMAGE="example.invalid/backend@sha256:$(printf 'a%.0s' {1..64})"
          export EDGE_IMAGE="example.invalid/edge@sha256:$(printf 'b%.0s' {1..64})"
          touch "$BACKEND_ENV_FILE"
          docker compose -f deploy/aws/compose.yml config --quiet
