user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Suppress request metadata; WS authentication headers must never enter logs.
error_log /dev/stderr crit;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 2m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Docker DNS is re-resolved after backend replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/bharatchat.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bharatchat.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
    server {
        listen 80;
        server_name bharatchat.in api.bharatchat.in;
        return 308 https://$host$request_uri;
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }
    server {
        listen 127.0.0.1:8081;
        location = /healthz { return 200 "ok\n"; }
        location / { return 404; }
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name bharatchat.in;
        root /usr/share/nginx/html;
        index index.html;
        # Do not serve stale application shells after a security release.
        expires -1;
        location / { try_files $uri $uri/ /index.html; }
        location ~ /\. { return 404; }
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name api.bharatchat.in;
        set $backend http://backend:8080;
        location /api/v1/ {
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            # Replace client-supplied forwarding headers at the public edge.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_next_upstream off;
        }
        location / { return 404; }
    }
}
