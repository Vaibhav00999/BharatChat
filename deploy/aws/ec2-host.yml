AWSTemplateFormatVersion: "2010-09-09"
Description: BharatChat prelaunch Ubuntu EC2 host. Creates billable resources, not a complete application deployment.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing Mumbai VPC with DNS resolution enabled.
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet in this VPC with a route to an Internet Gateway.
  TesterIPv4:
    Type: String
    AllowedPattern: '(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32'
    ConstraintDescription: Supply one tester public IPv4 address with /32, not the entire internet.
    Description: Only this address can reach HTTPS/HTTP during prelaunch.
  UbuntuImage:
    Type: AWS::EC2::Image::Id
    Description: Must match the reviewed AMI pinned in provisioning-iam.yml parameters.
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large]
    Description: Initial staging size; production sizing requires load tests.
  HostInstanceProfile:
    Type: String
    Default: bharatchat-prelaunch-host
    AllowedValues: [bharatchat-prelaunch-host]
    Description: Pre-created by the owner-approved provisioning-iam.yml bootstrap.

Rules:
  MumbaiOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", ap-south-1]
        AssertDescription: Create this stack in ap-south-1.
  SubnetInVpc:
    Assertions:
      - Assert:
          Fn::EachMemberIn:
            - Fn::ValueOfAll: ["AWS::EC2::Subnet::Id", VpcId]
            - Fn::RefAll: "AWS::EC2::VPC::Id"
        AssertDescription: The public subnet must belong to the selected VPC.

Resources:
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Prelaunch web access from one tester, no public SSH or datastores
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref TesterIPv4
          Description: Tester HTTPS
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref TesterIPv4
          Description: Tester HTTP redirect only
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Host updates, AWS APIs, MSG91, and private datastores; restrict with reviewed egress policy before launch
      Tags:
        - Key: Name
          Value: bharatchat-prelaunch
        - Key: Project
          Value: BharatChat

  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuImage
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostInstanceProfile
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds: [!Ref HostSecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpProtocolIpv6: disabled
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: disabled
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: bharatchat-prelaunch
        - Key: Project
          Value: BharatChat
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          # Canonical's Ubuntu AMI includes the SSM Agent. No credentials in user data.
          systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service
          install -d -m 700 /etc/bharatchat
          install -d -m 755 /opt/bharatchat

  PublicIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Host
      Tags:
        - Key: Name
          Value: bharatchat-prelaunch
        - Key: Project
          Value: BharatChat

Outputs:
  InstanceId:
    Value: !Ref Host
  ElasticIP:
    Value: !Ref PublicIP
  AppSecurityGroupId:
    Description: Allow inbound PostgreSQL/Redis only from this group in the private datastore security groups.
    Value: !Ref HostSecurityGroup
  SessionManagerCommand:
    Value: !Sub aws ssm start-session --region ap-south-1 --target ${Host}
